<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#926B0F;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="rimGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#926B0F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:1"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#rimGradient)" />

  <circle cx="50" cy="50" r="44" fill="url(#goldGradient)" filter="url(#shadow)" stroke="#856404" stroke-width="0.5"/>

  <circle cx="50" cy="50" r="38" fill="none" stroke="#B8860B" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>

  <path d="M42 30 
           V70 
           H58 
           C72 70, 72 30, 58 30 
           Z 
           M48 36 
           H56 
           C64 36, 64 64, 56 64 
           H48 
           V36 Z" 
        fill="#1A1A1A" 
        fill-rule="evenodd" />
  
  <ellipse cx="35" cy="30" rx="12" ry="6" fill="#FFFFFF" opacity="0.2" transform="rotate(-45 35 30)" />
</svg>
